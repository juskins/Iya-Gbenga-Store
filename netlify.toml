[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner fails builds when an env value appears in the output or repo.
  # Only keep REAL secrets scanned (SMTP_PASS, SUPABASE_SERVICE_ROLE_KEY); everything below is
  # public or non-sensitive (e.g. smtp.gmail.com appears in Nodemailer itself).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_WHATSAPP_NUMBER,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_FROM,BANK_NAME,BANK_ACCOUNT_NUMBER,BANK_ACCOUNT_NAME"
