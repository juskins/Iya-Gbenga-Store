[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner fails builds when an env value appears in the output.
  # These are PUBLIC by design (they ship to the browser), so exclude them from the scan.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_WHATSAPP_NUMBER"
